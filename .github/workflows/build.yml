name: Build APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Set Gradle JVM args
        run: printf "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m\n" >> gradle.properties

      - name: Generate temporary keystore
        run: |
          keytool -genkey -v -keystore nuviotv.jks \
            -alias nuviotv \
            -keyalg RSA -keysize 2048 -validity 365 \
            -storepass 815787 \
            -keypass 815787 \
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"

      - name: Create artifacts directory
        run: mkdir -p dist

      # --- 1. ARM64 ---
      - name: Build APK arm64-v8a
        run: ./gradlew :app:assembleFullDebug -Pandroid.injected.build.abi=arm64-v8a
        env:
          NUVIO_RELEASE_KEY_ALIAS: nuviotv
          NUVIO_RELEASE_KEY_PASSWORD: "815787"
          NUVIO_RELEASE_STORE_PASSWORD: "815787"

      - name: Save arm64 APK
        run: |
          # Cerchiamo qualsiasi file .apk o .aab generato nel progetto
          FILE=$(find . -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | grep -v "dist/" | head -1)
          if [ -z "$FILE" ]; then
            echo "[ERROR] Nessun file APK o AAB trovato dopo la build arm64!"
            echo "Ecco la struttura dei file generati per capire dove sono finiti:"
            find . -maxdepth 4 -not -path '*/.*'
            exit 1
          fi
          echo "Found file: $FILE"
          # Estraiamo l'estensione originale (.apk o .aab)
          EXT="${FILE##*.}"
          cp "$FILE" "dist/nuvio-arm64.$EXT"
          # Puliamo solo i file generati per non ritrovarli al prossimo step
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -not -path "./dist/*" -delete

      # --- 2. ARMEABI-V7A ---
      - name: Build APK armeabi-v7a
        run: ./gradlew :app:assembleFullDebug -Pandroid.injected.build.abi=armeabi-v7a
        env:
          NUVIO_RELEASE_KEY_ALIAS: nuviotv
          NUVIO_RELEASE_KEY_PASSWORD: "815787"
          NUVIO_RELEASE_STORE_PASSWORD: "815787"

      - name: Save v7a APK
        run: |
          FILE=$(find . -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | grep -v "dist/" | head -1)
          if [ -z "$FILE" ]; then
            echo "[ERROR] Nessun file APK o AAB trovato dopo la build v7a!"
            exit 1
          fi
          echo "Found file: $FILE"
          EXT="${FILE##*.}"
          cp "$FILE" "dist/nuvio-v7a.$EXT"
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -not -path "./dist/*" -delete

      # --- 3. UNIVERSAL ---
      - name: Build APK universal
        continue-on-error: true
        id: build_universal
        run: ./gradlew :app:assembleFullDebug
        env:
          NUVIO_RELEASE_KEY_ALIAS: nuviotv
          NUVIO_RELEASE_KEY_PASSWORD: "815787"
          NUVIO_RELEASE_STORE_PASSWORD: "815787"

      - name: Save universal APK
        if: steps.build_universal.outcome == 'success'
        run: |
          FILE=$(find . -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | grep -v "dist/" | head -1)
          if [ ! -z "$FILE" ]; then
            echo "Found file: $FILE"
            EXT="${FILE##*.}"
            cp "$FILE" "dist/nuvio-universal.$EXT"
          fi

      # --- RELEASE AND UPLOAD ---
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: "Build #${{ github.run_number }}"
          body: "Build automatica dal branch ${{ github.ref_name }}"
          draft: false
          prerelease: true

      - name: Upload arm64 Artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ (find dist/ -name "nuvio-arm64.*" | head -1) }}
          asset_name: ${{ (basename $(find dist/ -name "nuvio-arm64.*" | head -1)) }}
          asset_content_type: application/octet-stream

      - name: Upload v7a Artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ (find dist/ -name "nuvio-v7a.*" | head -1) }}
          asset_name: ${{ (basename $(find dist/ -name "nuvio-v7a.*" | head -1)) }}
          asset_content_type: application/octet-stream

      - name: Upload universal Artifact
        if: steps.build_universal.outcome == 'success'
        run: |
          UNI_FILE=$(find dist/ -name "nuvio-universal.*" | head -1)
          if [ ! -z "$UNI_FILE" ]; then
            echo "Uploading universal artifact..."
          fi
        # Nota: Per caricare dinamicamente l'estensione nell'azione usiamo uno step bash standard più flessibile per l'universal
      - name: Upload universal Artifact (Action)
        if: steps.build_universal.outcome == 'success'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ (find dist/ -name "nuvio-universal.*" | head -1) }}
          asset_name: ${{ (basename $(find dist/ -name "nuvio-universal.*" | head -1)) }}
          asset_content_type: application/octet-stream
