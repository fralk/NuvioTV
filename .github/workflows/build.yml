name: Build APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build APK arm64-v8a
        run: ./gradlew :app:assembleFullDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Rename arm64 APK
        run: mv app/build/outputs/apk/full/debug/*.apk app/build/outputs/apk/full/debug/nuvio-arm64.apk

      - name: Build APK armeabi-v7a
        run: ./gradlew :app:assembleFullDebug -Pandroid.injected.build.abi=armeabi-v7a

      - name: Rename v7a APK
        run: mv app/build/outputs/apk/full/debug/*.apk app/build/outputs/apk/full/debug/nuvio-v7a.apk

      - name: Build APK universal
        run: ./gradlew :app:assembleFullDebug

      - name: Rename universal APK
        run: mv app/build/outputs/apk/full/debug/app-full-debug.apk app/build/outputs/apk/full/debug/nuvio-universal.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-all
          path: app/build/outputs/apk/full/debug/*.apk
