name: Build APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Set Gradle JVM args
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Generate temporary keystore
        run: |
          keytool -genkey -v -keystore nuviotv.jks \
            -alias nuviotv \
            -keyalg RSA -keysize 2048 -validity 365 \
            -storepass 815787 \
            -keypass 815787 \
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"

      - name: Build APK arm64-v8a
        run: ./gradlew :app:assembleFullDebug -Pandroid.injected.build.abi=arm64-v8a
        env:
          NUVIO_RELEASE_KEY_ALIAS: nuviotv
          NUVIO_RELEASE_KEY_PASSWORD: "815787"
          NUVIO_RELEASE_STORE_PASSWORD: "815787"

      - name: Find APK location
        run: find . -name "*.apk" -type f 2>/dev/null

      - name: Rename arm64 APK
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          echo "Found APK: $APK"
          mkdir -p app/build/outputs/apk/full/debug
          cp "$APK" app/build/outputs/apk/full/debug/nuvio-arm64.apk

      - name: Build APK armeabi-v7a
        run: ./gradlew :app:assembleFullDebug -Pandroid.injected.build.abi=armeabi-v7a
        env:
          NUVIO_RELEASE_KEY_ALIAS: nuviotv
          NUVIO_RELEASE_KEY_PASSWORD: "815787"
          NUVIO_RELEASE_STORE_PASSWORD: "815787"

      - name: Rename v7a APK
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | grep -v "nuvio-arm64" | head -1)
          echo "Found APK: $APK"
          cp "$APK" app/build/outputs/apk/full/debug/nuvio-v7a.apk

      - name: Build APK universal
        continue-on-error: true
        id: build_universal
        run: ./gradlew :app:assembleFullDebug
        env:
          NUVIO_RELEASE_KEY_ALIAS: nuviotv
          NUVIO_RELEASE_KEY_PASSWORD: "815787"
          NUVIO_RELEASE_STORE_PASSWORD: "815787"

      - name: Rename universal APK
        if: steps.build_universal.outcome == 'success'
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | grep -v "nuvio-arm64" | grep -v "nuvio-v7a" | head -1)
          echo "Found APK: $APK"
          cp "$APK" app/build/outputs/apk/full/debug/nuvio-universal.apk

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: "Build #${{ github.run_number }}"
          body: "Build automatica dal branch ${{ github.ref_name }}"
          draft: false
          prerelease: true

      - name: Upload arm64 APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/full/debug/nuvio-arm64.apk
          asset_name: nuvio-arm64.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload v7a APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/full/debug/nuvio-v7a.apk
          asset_name: nuvio-v7a.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload universal APK to Release
        if: steps.build_universal.outcome == 'success'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/full/debug/nuvio-universal.apk
          asset_name: nuvio-universal.apk
          asset_content_type: application/vnd.android.package-archive
