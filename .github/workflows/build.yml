name: Build APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Generate temporary keystore
        run: |
          keytool -genkey -v -keystore nuviotv.jks \
            -alias nuviotv \
            -keyalg RSA -keysize 2048 -validity 365 \
            -storepass 815787 \
            -keypass 815787 \
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"

      - name: Build APK arm64-v8a
        run: ./gradlew :app:assembleFullDebug -Pandroid.injected.build.abi=arm64-v8a
        env:
          NUVIO_RELEASE_KEY_ALIAS: nuviotv
          NUVIO_RELEASE_KEY_PASSWORD: "815787"
          NUVIO_RELEASE_STORE_PASSWORD: "815787"

      - name: Rename arm64 APK
        run: find app/build/outputs/apk -name "*.apk" | head -1 | xargs -I{} mv {} app/build/outputs/apk/full/debug/nuvio-arm64.apk

      - name: Build APK armeabi-v7a
        run: ./gradlew :app:assembleFullDebug -Pandroid.injected.build.abi=armeabi-v7a
        env:
          NUVIO_RELEASE_KEY_ALIAS: nuviotv
          NUVIO_RELEASE_KEY_PASSWORD: "815787"
          NUVIO_RELEASE_STORE_PASSWORD: "815787"

      - name: Rename v7a APK
        run: find app/build/outputs/apk -name "*.apk" ! -name "nuvio-arm64.apk" | head -1 | xargs -I{} mv {} app/build/outputs/apk/full/debug/nuvio-v7a.apk

      - name: Build APK universal
        run: ./gradlew :app:assembleFullDebug
        env:
          NUVIO_RELEASE_KEY_ALIAS: nuviotv
          NUVIO_RELEASE_KEY_PASSWORD: "815787"
          NUVIO_RELEASE_STORE_PASSWORD: "815787"

      - name: Rename universal APK
        run: find app/build/outputs/apk -name "*.apk" ! -name "nuvio-arm64.apk" ! -name "nuvio-v7a.apk" | head -1 | xargs -I{} mv {} app/build/outputs/apk/full/debug/nuvio-universal.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-all
          path: app/build/outputs/apk/full/debug/*.apk
